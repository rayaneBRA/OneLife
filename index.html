<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حياتي - تطبيقك الشخصي</title>

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#084d38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حياتي">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #f5f1e8;
  --bg-secondary: #ffffff;
  --bg-card: #fffdf7;
  --text-primary: #2c1810;
  --text-secondary: #5a4632;
  --accent: #0d6b4e;
  --accent-light: #1a8f6a;
  --accent-dark: #084d38;
  --gold: #c9a961;
  --gold-light: #e0c987;
  --border: #d4c5a0;
  --shadow: rgba(44, 24, 16, 0.1);
  --danger: #a63a3a;
  --success: #2d7a4f;
  --purple: #6b4e9e;
}

[data-theme="dark"] {
  --bg-primary: #0f1419;
  --bg-secondary: #1a2332;
  --bg-card: #1e2a3a;
  --text-primary: #e8dcc4;
  --text-secondary: #b8a88a;
  --accent: #2d9d78;
  --accent-light: #3fb892;
  --accent-dark: #1f7a5c;
  --gold: #d4b876;
  --gold-light: #e8d09a;
  --border: #2d3a4d;
  --shadow: rgba(0, 0, 0, 0.4);
  --danger: #d65454;
  --success: #3fa870;
  --purple: #9b7fd4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  transition: all 0.4s ease;
}

.header {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: var(--gold-light);
  padding: 25px 20px 60px;
  text-align: center;
  position: relative;
  box-shadow: 0 4px 20px var(--shadow);
}

.header-content { position: relative; z-index: 2; }
.header h1 { font-family: 'Reem Kufi', serif; font-size: 2.5rem; margin-bottom: 5px; }
.header .subtitle { font-family: 'Amiri', serif; font-size: 1.1rem; opacity: 0.9; }

.theme-toggle {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(255,255,255,0.15);
  border: 1px solid var(--gold);
  color: var(--gold-light);
  width: 45px;
  height: 45px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.3rem;
  z-index: 3;
}

.nav-container {
  max-width: 1200px;
  margin: -40px auto 0;
  padding: 0 15px;
  position: relative;
  z-index: 10;
}

.nav-tabs {
  display: flex;
  background: var(--bg-secondary);
  border-radius: 15px;
  padding: 8px;
  box-shadow: 0 8px 25px var(--shadow);
  gap: 5px;
}

.nav-tab {
  flex: 1;
  padding: 12px 10px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.nav-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
}

.main-content {
  max-width: 1200px;
  margin: 25px auto;
  padding: 0 15px 40px;
}

.section { display: none; }
.section.active { display: block; }

.card {
  background: var(--bg-card);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px var(--shadow);
  border: 1px solid var(--border);
}

.card-title {
  font-family: 'Reem Kufi', serif;
  font-size: 1.5rem;
  color: var(--accent);
  margin-bottom: 20px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 12px;
}

/* ===== مواقيت الصلاة ===== */
.date-info {
  text-align: center;
  margin-bottom: 20px;
}

.date-pill {
  display: inline-block;
  background: rgba(201, 169, 97, 0.15);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 8px 20px;
  border-radius: 25px;
  margin: 5px;
  font-size: 0.95rem;
  font-weight: 600;
}

.next-prayer-box {
  text-align: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
}

.next-prayer-box .label { font-size: 1rem; opacity: 0.9; margin-bottom: 8px; }
.next-prayer-box .name { font-family: 'Reem Kufi', serif; font-size: 1.6rem; margin-bottom: 10px; }
.next-prayer-box .countdown { font-size: 2.5rem; font-weight: 700; font-family: 'Reem Kufi', serif; letter-spacing: 2px; }

.prayer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
}

.prayer-card {
  background: var(--bg-secondary);
  padding: 20px 15px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid var(--border);
  position: relative;
}

.prayer-card.next {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
}

.prayer-card.passed .check {
  position: absolute;
  top: 8px;
  left: 8px;
  color: var(--success);
  font-weight: 700;
}

.prayer-name { font-family: 'Reem Kufi', serif; font-size: 1.2rem; color: var(--accent); }
.prayer-card.next .prayer-name { color: white; }
.prayer-time { font-size: 1.1rem; font-weight: 700; }
.prayer-icon { font-size: 2rem; margin-bottom: 8px; }

/* ===== النماذج ===== */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-weight: 600; }

.form-control {
  width: 100%;
  padding: 12px 15px;
  background: var(--bg-secondary);
  border: 2px solid var(--border);
  border-radius: 10px;
  color: var(--text-primary);
  font-family: 'Cairo', sans-serif;
}

.form-control:focus { outline: none; border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

.btn {
  padding: 12px 25px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
}

.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--accent-dark); }
.btn-purple { background: linear-gradient(135deg, var(--purple), #8a6bc4); color: white; }
.btn-small { width: auto; padding: 8px 15px; font-size: 0.85rem; }

/* ===== المدخرات ===== */
.savings-display {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: white;
  border-radius: 15px;
  margin-bottom: 20px;
}

.savings-amount { font-size: 3rem; font-weight: 700; font-family: 'Reem Kufi', serif; }

.transaction-item {
  background: var(--bg-secondary);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-right: 4px solid var(--success);
}

.transaction-info h4 { font-size: 1.05rem; margin-bottom: 4px; }
.transaction-info .meta { font-size: 0.85rem; color: var(--text-secondary); }
.transaction-amount { font-weight: 700; font-size: 1.1rem; color: var(--success); }

.delete-btn { background: transparent; border: none; color: var(--danger); cursor: pointer; padding: 5px; font-size: 1rem; }

/* ===== الحصالة ===== */
.goal-card {
  background: var(--bg-secondary);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
  border-right: 5px solid var(--purple);
  box-shadow: 0 2px 8px var(--shadow);
}

.goal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.goal-name { font-family: 'Reem Kufi', serif; font-size: 1.4rem; color: var(--purple); }
.goal-stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 12px; font-size: 0.9rem; }
.goal-stat { background: var(--bg-card); padding: 8px 14px; border-radius: 8px; color: var(--text-secondary); }
.goal-stat strong { color: var(--text-primary); }

.progress-bar-bg {
  width: 100%;
  height: 14px;
  background: var(--bg-card);
  border-radius: 7px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple), var(--gold));
  border-radius: 7px;
  transition: width 0.6s ease;
}

.progress-text { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 6px; color: var(--text-secondary); }

.goal-completed {
  background: linear-gradient(135deg, var(--success), #3fa870);
  color: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: 700;
  margin-bottom: 15px;
  display: none;
}

.goal-completed.show { display: block; }

.deposit-input-row { display: flex; gap: 10px; margin-top: 15px; }
.deposit-input-row .form-control { flex: 1; }

.deposit-history { margin-top: 12px; max-height: 150px; overflow-y: auto; }

.deposit-item {
  background: var(--bg-card);
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 5px;
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
}

/* ===== عام ===== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
.loading { text-align: center; padding: 30px; }

.spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.islamic-quote {
  font-family: 'Amiri', serif;
  text-align: center;
  padding: 15px;
  color: var(--gold);
  font-size: 1.1rem;
  margin-top: 15px;
  border-top: 1px solid var(--border);
}

.location-info {
  background: var(--bg-secondary);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-right: 4px solid var(--gold);
  flex-wrap: wrap;
  gap: 10px;
}

.btn-install {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  max-width: 300px;
  margin: 0 auto;
  padding: 15px 25px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--accent-dark);
  border: none;
  border-radius: 15px;
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(201, 169, 97, 0.4);
  z-index: 1000;
  display: none;
}

@media (max-width: 768px) {
  .header h1 { font-size: 1.8rem; }
  .form-row { grid-template-columns: 1fr; }
  .savings-amount { font-size: 2.2rem; }
  .next-prayer-box .countdown { font-size: 2rem; }
}
</style>
</head>
<body>

<div class="header">
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  <div class="header-content">
    <h1>✦ حياتي ✦</h1>
    <div class="subtitle">بسم الله الرحمن الرحيم</div>
  </div>
</div>

<div class="nav-container">
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showSection('prayer', this)">🕌 الأذان</button>
    <button class="nav-tab" onclick="showSection('savings', this)">💎 المدخرات</button>
    <button class="nav-tab" onclick="showSection('goals', this)">🎯 الحصالة</button>
  </div>
</div>

<div class="main-content">

  <!-- ===== الأذان ===== -->
  <div class="section active" id="prayer">
    <div class="card">
      <h2 class="card-title">🕐 مواقيت الصلاة</h2>
      <div class="location-info" id="locationInfo">
        <span>📍 جاري تحديد موقعك...</span>
        <button class="btn btn-gold btn-small" onclick="getPrayerTimes()">🔄 تحديث</button>
      </div>
      <div class="date-info" id="dateInfo"></div>
      <div class="next-prayer-box" id="nextPrayerBox" style="display:none;">
        <div class="label">الصلاة القادمة</div>
        <div class="name" id="nextPrayerName">—</div>
        <div class="countdown" id="prayerCountdown">--:--:--</div>
      </div>
      <div id="prayerTimesContainer">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <div class="islamic-quote">"إن الصلاة كانت على المؤمنين كتاباً موقوتاً"</div>
    </div>
  </div>

  <!-- ===== المدخرات ===== -->
  <div class="section" id="savings">
    <div class="savings-display">
      <div style="font-size: 1.1rem; opacity: 0.9;">إجمالي مدخراتك</div>
      <div class="savings-amount" id="totalSavings">0 دج</div>
    </div>

    <div class="card">
      <h2 class="card-title">💰 إضافة مبلغ للمدخرات</h2>
      <form id="savingsForm">
        <div class="form-group">
          <label>المبلغ (دج)</label>
          <input type="number" class="form-control" id="savingAmount" step="0.01" required>
        </div>
        <div class="form-group">
          <label>ملاحظة (اختياري)</label>
          <input type="text" class="form-control" id="savingNote">
        </div>
        <button type="submit" class="btn btn-gold">إضافة للمدخرات</button>
      </form>
    </div>

    <div class="card">
      <h2 class="card-title">📋 سجل المدخرات</h2>
      <div id="savingsList"></div>
    </div>
  </div>

  <!-- ===== الحصالة ===== -->
  <div class="section" id="goals">
    <div class="card">
      <h2 class="card-title">🎯 إنشاء هدف ادخار جديد</h2>
      <form id="goalForm">
        <div class="form-group">
          <label>اسم الهدف</label>
          <input type="text" class="form-control" id="goalName" required placeholder="مثال: آيفون، سفر، سيارة...">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>المبلغ المطلوب (دج)</label>
            <input type="number" class="form-control" id="goalTarget" step="0.01" required>
          </div>
          <div class="form-group">
            <label>عدد الأيام</label>
            <input type="number" class="form-control" id="goalDays" min="1" required placeholder="مثال: 30">
          </div>
        </div>
        <div class="form-group">
          <label>ملاحظة (اختياري)</label>
          <input type="text" class="form-control" id="goalNote">
        </div>
        <button type="submit" class="btn btn-purple">إنشاء الهدف</button>
      </form>
    </div>

    <div class="card">
      <h2 class="card-title">📋 أهدافي</h2>
      <div id="goalsList"></div>
    </div>
  </div>

</div>

<button class="btn-install" id="installBtn" onclick="installApp()">📱 تثبيت التطبيق</button>

<script>
// ============ Theme ============
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const newTheme = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  document.getElementById('themeBtn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}

const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

// ============ Navigation ============
function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ============ PWA Install ============
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

async function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  }
}

window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

// ============ Prayer Times ============
let prayerTimesData = [];
let nextPrayerTime = null;

async function getPrayerTimes() {
  const container = document.getElementById('prayerTimesContainer');
  const locationInfo = document.getElementById('locationInfo');
  container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude.toFixed(4);
    const lon = pos.coords.longitude.toFixed(4);

    try {
      const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ar`);
      const geoData = await geoRes.json();
      const city = geoData.address.city || geoData.address.town || 'موقعك الحالي';
      locationInfo.innerHTML = `<span>📍 ${city}</span><button class="btn btn-gold btn-small" onclick="getPrayerTimes()">🔄 تحديث</button>`;

      const today = new Date();
      const dateStr = `${today.getDate()}-${today.getMonth()+1}-${today.getFullYear()}`;
      const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lon}&method=4`);
      const data = await res.json();
      const timings = data.data.timings;

      // التاريخ الهجري والميلادي
      const hijri = data.data.date.hijri;
      const weekday = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][today.getDay()];
      document.getElementById('dateInfo').innerHTML = `
        <div class="date-pill">🌙 ${hijri.day} ${hijri.month.ar} ${hijri.year} هـ</div>
        <div class="date-pill">📅 ${weekday}، ${today.getDate()} ${['يناير','فبراير','مارس','أبريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][today.getMonth()]} ${today.getFullYear()}</div>
      `;

      prayerTimesData = [
        { name: 'الفجر', time: timings.Fajr, icon: '🌅' },
        { name: 'الشروق', time: timings.Sunrise, icon: '🌄' },
        { name: 'الظهر', time: timings.Dhuhr, icon: '☀️' },
        { name: 'العصر', time: timings.Asr, icon: '🌤️' },
        { name: 'المغرب', time: timings.Maghrib, icon: '🌇' },
        { name: 'العشاء', time: timings.Isha, icon: '🌙' }
      ];

      renderPrayerGrid();
      updateNextPrayer();
    } catch (err) {
      container.innerHTML = '<p style="text-align:center; color: var(--danger);">حدث خطأ في تحميل المواقيت</p>';
    }
  }, () => {
    container.innerHTML = '<p style="text-align:center; color: var(--danger);">يرجى السماح بالوصول للموقع</p>';
  });
}

function renderPrayerGrid() {
  const container = document.getElementById('prayerTimesContainer');
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  let html = '<div class="prayer-grid">';
  prayerTimesData.forEach(p => {
    const [h, m] = p.time.split(':').map(Number);
    const pm = h * 60 + m;
    const isNext = nextPrayerTime && p.name === nextPrayerTime.name;
    const isPassed = pm < currentMinutes;
    html += `<div class="prayer-card ${isNext ? 'next' : ''} ${isPassed ? 'passed' : ''}">
      ${isPassed ? '<div class="check">✓</div>' : ''}
      <div class="prayer-icon">${p.icon}</div>
      <div class="prayer-name">${p.name}</div>
      <div class="prayer-time">${p.time}</div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function updateNextPrayer() {
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  nextPrayerTime = null;

  for (const p of prayerTimesData) {
    const [h, m] = p.time.split(':').map(Number);
    if (h * 60 + m > currentMinutes) { nextPrayerTime = p; break; }
  }

  const box = document.getElementById('nextPrayerBox');
  if (nextPrayerTime) {
    box.style.display = 'block';
    document.getElementById('nextPrayerName').textContent = `☀️ ${nextPrayerTime.name} · ${nextPrayerTime.time}`;
  } else {
    // ما بقيت صلاة اليوم → فجر الغد
    box.style.display = 'block';
    document.getElementById('nextPrayerName').textContent = `🌅 الفجر · ${prayerTimesData[0].time}`;
  }
}

function tickCountdown() {
  if (!nextPrayerTime && prayerTimesData.length === 0) return;
  const now = new Date();

  let target;
  if (nextPrayerTime) {
    const [h, m] = nextPrayerTime.time.split(':').map(Number);
    target = new Date(now);
    target.setHours(h, m, 0, 0);
  } else {
    const [h, m] = prayerTimesData[0].time.split(':').map(Number);
    target = new Date(now);
    target.setDate(target.getDate() + 1);
    target.setHours(h, m, 0, 0);
  }

  let diff = Math.max(Math.floor((target - now) / 1000), 0);
  const hh = String(Math.floor(diff / 3600)).padStart(2, '0');
  const mm = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
  const ss = String(diff % 60).padStart(2, '0');
  document.getElementById('prayerCountdown').textContent = `${hh}:${mm}:${ss}`;

  // لو عدت الصلاة، حدّث القائمة
  if (diff === 0) {
    updateNextPrayer();
    renderPrayerGrid();
  }
}

setInterval(tickCountdown, 1000);

// ============ Savings ============
let savings = JSON.parse(localStorage.getItem('savings') || '[]');

document.getElementById('savingsForm').addEventListener('submit', (e) => {
  e.preventDefault();
  savings.unshift({
    id: Date.now(),
    amount: parseFloat(document.getElementById('savingAmount').value),
    date: new Date().toISOString().split('T')[0],
    note: document.getElementById('savingNote').value
  });
  localStorage.setItem('savings', JSON.stringify(savings));
  renderSavings();
  e.target.reset();
});

function deleteSaving(id) {
  if (confirm('حذف؟')) {
    savings = savings.filter(s => s.id !== id);
    localStorage.setItem('savings', JSON.stringify(savings));
    renderSavings();
  }
}

function renderSavings() {
  const total = savings.reduce((sum, s) => sum + s.amount, 0);
  document.getElementById('totalSavings').textContent = total.toFixed(2) + ' دج';
  const list = document.getElementById('savingsList');
  if (savings.length === 0) {
    list.innerHTML = '<div class="empty-state">لا توجد مدخرات</div>';
    return;
  }
  list.innerHTML = savings.map(s => `
    <div class="transaction-item">
      <div style="display: flex; align-items: center; flex: 1;">
        <button class="delete-btn" onclick="deleteSaving(${s.id})">🗑️</button>
        <div class="transaction-info">
          <h4>💰 ${s.note || 'إيداع'}</h4>
          <div class="meta">📅 ${s.date}</div>
        </div>
      </div>
      <div class="transaction-amount">+${s.amount.toFixed(2)} دج</div>
    </div>
  `).join('');
}

// ============ Goals ============
let goals = JSON.parse(localStorage.getItem('goals') || '[]');

document.getElementById('goalForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('goalName').value.trim();
  const target = parseFloat(document.getElementById('goalTarget').value);
  const days = parseInt(document.getElementById('goalDays').value);
  const note = document.getElementById('goalNote').value;

  const startDate = new Date();
  const endDate = new Date();
  endDate.setDate(endDate.getDate() + days);

  goals.push({
    id: Date.now(),
    name, target, days, note,
    startDate: startDate.toISOString().split('T')[0],
    endDate: endDate.toISOString().split('T')[0],
    deposits: []
  });

  localStorage.setItem('goals', JSON.stringify(goals));
  renderGoals();
  e.target.reset();
});

function depositToGoal(goalId) {
  const input = document.getElementById('deposit-' + goalId);
  const amount = parseFloat(input.value);
  if (!amount || amount <= 0) { alert('أدخل مبلغ صحيح'); return; }

  const goal = goals.find(g => g.id === goalId);
  goal.deposits.unshift({ id: Date.now(), amount, date: new Date().toISOString().split('T')[0] });
  localStorage.setItem('goals', JSON.stringify(goals));
  renderGoals();
}

function deleteGoalDeposit(goalId, depositId) {
  if (confirm('حذف الإيداع؟')) {
    const goal = goals.find(g => g.id === goalId);
    goal.deposits = goal.deposits.filter(d => d.id !== depositId);
    localStorage.setItem('goals', JSON.stringify(goals));
    renderGoals();
  }
}

function deleteGoal(goalId) {
  if (confirm('حذف الهدف بالكامل؟')) {
    goals = goals.filter(g => g.id !== goalId);
    localStorage.setItem('goals', JSON.stringify(goals));
    renderGoals();
  }
}

function renderGoals() {
  const list = document.getElementById('goalsList');
  if (goals.length === 0) {
    list.innerHTML = '<div class="empty-state">🎯 لا توجد أهداف بعد<br>أنشئ أول هدف ادخار!</div>';
    return;
  }

  list.innerHTML = goals.map(g => {
    const current = g.deposits.reduce((sum, d) => sum + d.amount, 0);
    const percent = Math.min((current / g.target) * 100, 100);
    const remaining = Math.max(g.target - current, 0);
    const today = new Date();
    const end = new Date(g.endDate);
    const daysLeft = Math.max(Math.ceil((end - today) / (1000 * 60 * 60 * 24)), 0);
    const dailyNeed = daysLeft > 0 ? (remaining / daysLeft) : remaining;
    const completed = current >= g.target;

    return `
      <div class="goal-card">
        <div class="goal-header">
          <div class="goal-name">🎯 ${g.name}</div>
          <button class="delete-btn" onclick="deleteGoal(${g.id})">🗑️</button>
        </div>
        ${g.note ? `<div style="color: var(--text-secondary); margin-bottom: 10px; font-size: 0.9rem;">${g.note}</div>` : ''}
        <div class="goal-completed ${completed ? 'show' : ''}">🎉 تم تحقيق الهدف! مبروك</div>
        <div class="goal-stats">
          <div class="goal-stat">الهدف: <strong>${g.target.toFixed(2)} دج</strong></div>
          <div class="goal-stat">المدخر: <strong style="color: var(--purple);">${current.toFixed(2)} دج</strong></div>
          <div class="goal-stat">المتبقي: <strong style="color: var(--danger);">${remaining.toFixed(2)} دج</strong></div>
        </div>
        <div style="margin-bottom: 15px;">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percent}%"></div>
          </div>
          <div class="progress-text">
            <span>${percent.toFixed(0)}% مكتمل</span>
            <span>⏳ ${daysLeft} يوم متبقي</span>
          </div>
        </div>
        ${!completed ? `
          <div class="goal-stat" style="margin-bottom: 10px;">
            💡 تحتاج ادخار <strong style="color: var(--accent);">${dailyNeed.toFixed(2)} دج</strong> يومياً
          </div>
          <div class="deposit-input-row">
            <input type="number" class="form-control" id="deposit-${g.id}" step="0.01" placeholder="أدخل المبلغ">
            <button class="btn btn-purple" style="width: auto; padding: 12px 20px;" onclick="depositToGoal(${g.id})">💰 إيداع</button>
          </div>
        ` : ''}
        ${g.deposits.length > 0 ? `
          <div class="deposit-history">
            <div style="font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">📝 سجل الإيداعات:</div>
            ${g.deposits.slice(0, 5).map(d => `
              <div class="deposit-item">
                <span>💰 ${d.amount.toFixed(2)} دج • ${d.date}</span>
                <button class="delete-btn" style="font-size: 0.8rem;" onclick="deleteGoalDeposit(${g.id}, ${d.id})">🗑️</button>
              </div>
            `).join('')}
            ${g.deposits.length > 5 ? `<div style="font-size: 0.8rem; color: var(--text-secondary); text-align: center;">+${g.deposits.length - 5} إيداع آخر</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

// ============ Initialize ============
document.addEventListener('DOMContentLoaded', () => {
  renderSavings();
  renderGoals();
  getPrayerTimes();
});

// ============ Service Worker ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
